services:
  backend:
    build: ./backend
    container_name: insurance-backend
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./web-frontend
    container_name: insurance-frontend
    ports:
      - "5173:80"  # map container port 80 to host 5173
    depends_on:
      - backend